function colorFor(count) {
  if (count >= 20) return "#7f1d1d";
  if (count >= 10) return "#b91c1c";
  if (count >= 5)  return "#dc2626";
  if (count >= 2)  return "#f97316";
  return "#0ea5e9";
}
function radiusFor(count) {
  return Math.min(22, 5 + Math.sqrt(count) * 3);
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function popupHtml(point) {
  const cityLine = `${escapeHtml(point.city)}${point.state ? ", " + escapeHtml(point.state) : ""}`;
  const items = point.companies.map(c => {
    const nameLink = c.linkedin
      ? `<a class="name" href="${escapeHtml(c.linkedin)}" target="_blank" rel="noopener">${escapeHtml(c.name)}</a>`
      : escapeHtml(c.name);
    const domain = c.domain ? `<a class="domain" href="https://${escapeHtml(c.domain)}" target="_blank" rel="noopener">${escapeHtml(c.domain)}</a>` : "";
    const meta = [c.size, c.type].filter(Boolean).map(escapeHtml).join(" · ");
    return `<li>${nameLink}<span class="sub">${domain}${domain && meta ? " · " : ""}${meta}</span></li>`;
  }).join("");
  return `
    <div class="popup-city">${cityLine}</div>
    <div class="popup-meta">${point.companies.length} ${point.companies.length === 1 ? "company" : "companies"}</div>
    <ul class="popup-list">${items}</ul>
  `;
}

const cluster = L.markerClusterGroup({

});

    radius: radiusFor(count),
    fillColor: colorFor(count),
    color: "#fff",
    weight: 1.5,
    opacity: 1,
    fillOpacity: 0.85,
  });
  marker.bindPopup(popupHtml(point), { maxWidth: 340 });
  marker._point = point;
  allMarkers.push(marker);
  cluster.addLayer(marker);
});
map.addLayer(cluster);

let activeSearch = "";

states.forEach(([code, count]) => {
  const row = document.createElement("div");
  row.className = "state-row";
  row.dataset.state = code;
  row.innerHTML = `<span class="state-name">${STATE_NAMES[code] || code}</span><span class="count">${count}</span>`;
  row.addEventListener("click", () => selectState(code));
  stateList.appendChild(row);
});

function applyFilter() {
  cluster.clearLayers();
  const matching = [];
  const search = activeSearch.toLowerCase().trim();
  allMarkers.forEach(m => {
    const p = m._point;
    if (activeState && p.state !== activeState) return;
    if (search) {
      const cityMatch = (p.city || "").toLowerCase().includes(search);
      const compMatch = p.companies.some(c => (c.name || "").toLowerCase().includes(search));
      if (!cityMatch && !compMatch) return;
    }
    matching.push(m);
  });
  cluster.addLayers(matching);
  if (matching.length && (activeState || search)) {
    const group = L.featureGroup(matching);
    map.fitBounds(group.getBounds().pad(0.15), { maxZoom: 9 });
  }
}

function selectState(code) {
  activeState = activeState === code ? null : code;
  document.querySelectorAll(".state-row").forEach(r => {
    r.classList.toggle("active", r.dataset.state === activeState);
  });
  resetBtn.disabled = !activeState && !activeSearch;
  applyFilter();
  if (!activeState && !activeSearch) {
    map.setView([39.5, -98.35], 4);
  }
}

resetBtn.addEventListener("click", () => {
  activeState = null;
  activeSearch = "";
  document.getElementById("search").value = "";
  document.querySelectorAll(".state-row").forEach(r => r.classList.remove("active"));
  resetBtn.disabled = true;
  cluster.clearLayers();
  cluster.addLayers(allMarkers);
  map.setView([39.5, -98.35], 4);
});

let searchTimer;
document.getElementById("search").addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    activeSearch = e.target.value;
    resetBtn.disabled = !activeState && !activeSearch;
    applyFilter();
  }, 200);
});
</script>
</body>
</html>
